<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Producción por Técnico — Portal Supervisores</title>
<meta name="description" content="Puntos Baremo diarios y totales por técnico, cada supervisor ve solo su equipo, Elecnor Chile.">
<style>
:root{
  --azul:#003F86; --naranja:#F47C02; --azul-claro:#cde2fb;
  --bg:#f4f6f9; --card:#ffffff; --ink:#14213d; --sub:#5b6b85; --border:#e2e7f0;
  --good:#1c8a4b; --good-bg:#e8f6ee; --warn:#b45309; --warn-bg:#fef3e2; --bad:#c0342c; --bad-bg:#fdeceb;
  --chip-bg:#eef1f6; --chip-off:#f4f6f9;
  --shadow:0 1px 3px rgba(20,33,61,.08), 0 1px 2px rgba(20,33,61,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1626; --card:#161f36; --ink:#eef2fb; --sub:#a9b6d0; --border:#2a3654;
    --good:#3ecb7e; --good-bg:#0f2a1d; --warn:#f0a94e; --warn-bg:#302008; --bad:#f0685f; --bad-bg:#331413;
    --azul-claro:#1c2c4a; --chip-bg:#1e2a47; --chip-off:#182034; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1626; --card:#161f36; --ink:#eef2fb; --sub:#a9b6d0; --border:#2a3654;
  --good:#3ecb7e; --good-bg:#0f2a1d; --warn:#f0a94e; --warn-bg:#302008; --bad:#f0685f; --bad-bg:#331413;
  --azul-claro:#1c2c4a; --chip-bg:#1e2a47; --chip-off:#182034; --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding-block:24px;}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px;}
.masthead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
.logo-chip{background:#fff;border-radius:10px;padding:8px 12px;display:flex;align-items:center;box-shadow:var(--shadow);}
.logo-chip img{height:34px;display:block;}
.masthead h1{font-size:1.4rem;margin:0;color:var(--ink);}
.masthead .sub{color:var(--sub);font-size:.88rem;margin-top:2px;}
.masthead-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.period-badge{background:var(--azul-claro);color:var(--azul);font-weight:600;padding:6px 14px;border-radius:999px;font-size:.82rem;}
.theme-btn{border:1px solid var(--border);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 10px;cursor:pointer;font-size:.85rem;}

.sup-toggle-wrap{margin-bottom:16px;}
.sup-toggle-label{font-size:.78rem;color:var(--sub);text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px;display:block;}
.sup-toggle-bar{display:flex;flex-wrap:wrap;gap:8px;}
.sup-toggle-btn{border:1px solid var(--border);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 16px;cursor:pointer;font-size:.86rem;font-weight:600;transition:background .12s,color .12s,border-color .12s;}
.sup-toggle-btn:hover{border-color:var(--azul);}
.sup-toggle-btn.active{background:var(--azul);border-color:var(--azul);color:#fff;}
.sup-toggle-btn .cnt{font-weight:500;opacity:.75;margin-left:4px;font-size:.8em;}

.stat-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px;}
.stat-tile{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);}
.stat-tile .lbl{font-size:.74rem;color:var(--sub);text-transform:uppercase;letter-spacing:.03em;}
.stat-tile .val{font-size:1.5rem;font-weight:700;margin-top:2px;color:var(--azul);}

.search-wrap{position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5;margin-bottom:10px;}
.search-input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--ink);font-size:.95rem;}
.search-input:focus{outline:2px solid var(--azul);}
.search-count{font-size:.78rem;color:var(--sub);margin-top:6px;}

details.supervisor{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden;}
details.supervisor > summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;align-items:center;gap:10px;font-weight:700;}
details.supervisor > summary::-webkit-details-marker{display:none;}
details.supervisor > summary::before{content:'▸';display:inline-block;transition:transform .15s;color:var(--sub);}
details.supervisor[open] > summary::before{transform:rotate(90deg);}
.sup-name{flex:1;}
.sup-meta{font-size:.78rem;color:var(--sub);font-weight:500;}
.sup-total{font-size:.9rem;color:var(--azul);font-weight:700;}

.tec-list{border-top:1px solid var(--border);}
details.tecnico{border-bottom:1px solid var(--border);}
details.tecnico:last-child{border-bottom:none;}
details.tecnico > summary{list-style:none;cursor:pointer;padding:11px 16px 11px 30px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
details.tecnico > summary::-webkit-details-marker{display:none;}
details.tecnico > summary::before{content:'+';display:inline-block;width:16px;color:var(--sub);font-weight:700;}
details.tecnico[open] > summary::before{content:'–';}
.tec-name{font-weight:600;font-size:.92rem;flex:1;min-width:160px;}
.tec-rut{font-size:.74rem;color:var(--sub);}
.tec-badge{font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--warn-bg);color:var(--warn);}
.tec-total{font-weight:700;color:var(--azul);font-size:.95rem;white-space:nowrap;}
.tec-dias-activos{font-size:.74rem;color:var(--sub);white-space:nowrap;}

.tec-detail{padding:6px 16px 16px 30px;}
.day-grid{display:flex;flex-wrap:wrap;gap:5px;}
.day-chip{width:52px;background:var(--chip-bg);border-radius:7px;padding:5px 2px;text-align:center;}
.day-chip.off{background:var(--chip-off);opacity:.5;}
.day-chip .dn{font-size:.62rem;color:var(--sub);}
.day-chip .dv{font-size:.76rem;font-weight:700;margin-top:1px;}

.hidden{display:none !important;}
footer{margin-top:24px;color:var(--sub);font-size:.78rem;text-align:center;}

.login-screen{min-height:80vh;display:flex;align-items:center;justify-content:center;}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:32px 28px;max-width:360px;width:100%;text-align:center;}
.login-card .logo-chip{margin:0 auto 18px;width:fit-content;}
.login-card h2{margin:0 0 4px;font-size:1.2rem;}
.login-card .sub{color:var(--sub);font-size:.86rem;margin-bottom:20px;}
.login-input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--ink);font-size:1rem;text-align:center;letter-spacing:.05em;margin-bottom:6px;}
.login-input:focus{outline:2px solid var(--azul);}
.login-hint{font-size:.74rem;color:var(--sub);margin-bottom:16px;}
.login-btn{width:100%;padding:12px;border-radius:10px;border:none;background:var(--azul);color:#fff;font-weight:700;font-size:.95rem;cursor:pointer;}
.login-btn:hover{opacity:.92;}
.login-error{color:var(--bad);font-size:.84rem;margin-top:12px;min-height:1.2em;}
.logout-btn{border:1px solid var(--border);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:.85rem;}
</style>
</head>

<script>
(function(){
  var DATA = JSON.parse(document.getElementById('produccion-data').textContent);

  // Login por RUT: ultimos 6 digitos antes del digito verificador (K -> 0), igual que el
  // Portal Produccion Tecnicos existente. Set cerrado de supervisores (no hay fuente para
  // Samuel Valenzuela -- no tiene tecnicos asignados actualmente de todas formas).
  var SUPERVISOR_RUTS = {
    '857535': 'JUAN CARLOS ESPAÑA GUERRERO',
    '420332': 'JULIO HERNAN PINTO HERRERA',
    '914420': 'RAMON CARLOS VARGAS FONTECHA'
  };

  function fmt1(n){ if (n===null||n===undefined) return '–'; return n.toLocaleString('es-CL',{minimumFractionDigits:1,maximumFractionDigits:1}); }
  function fmt0(n){ return Math.round(n).toLocaleString('es-CL'); }

  document.getElementById('periodBadge').textContent = DATA.periodoDesde + ' al ' + DATA.periodoHasta;
  document.getElementById('footerDate').textContent = DATA.generatedAt;

  // Group by supervisor, preserving order already sorted server-side
  var bySup = {};
  var supOrder = [];
  DATA.tecnicos.forEach(function(t){
    if (!bySup[t.Supervisor]) { bySup[t.Supervisor] = []; supOrder.push(t.Supervisor); }
    bySup[t.Supervisor].push(t);
  });

  function dayNum(dStr){ return dStr.split('-')[0]; }

  function renderStats(list){
    var total = 0;
    list.forEach(function(t){ total += t.Total; });
    var html = ''
      + '<div class="stat-tile"><div class="lbl">Técnicos</div><div class="val">'+list.length+'</div></div>'
      + '<div class="stat-tile"><div class="lbl">Baremo total periodo</div><div class="val">'+fmt1(total)+' pts</div></div>'
      + '<div class="stat-tile"><div class="lbl">Promedio por técnico</div><div class="val">'+fmt1(list.length ? total/list.length : 0)+' pts</div></div>';
    document.getElementById('statStrip').innerHTML = html;
  }

  function renderGroups(supsToShow){
    var groupsHtml = '';
    supsToShow.forEach(function(sup, gi){
      var list = bySup[sup];
      var supTotal = 0;
      list.forEach(function(t){ supTotal += t.Total; });

      var tecRows = list.map(function(t){
        var chips = DATA.dias.map(function(d, i){
          var v = t.Dias[i];
          if (v === null || v === undefined) {
            return '<div class="day-chip off"><div class="dn">'+dayNum(d)+'</div><div class="dv">–</div></div>';
          }
          return '<div class="day-chip"><div class="dn">'+dayNum(d)+'</div><div class="dv">'+fmt1(v)+'</div></div>';
        }).join('');
        var estadoBadge = (t.Estado2 && t.Estado2 !== 'ACTIVO') ? '<span class="tec-badge">'+t.Estado2+'</span>' : '';
        return '<details class="tecnico" data-nombre="'+t.Nombre.toLowerCase()+'">'
          + '<summary>'
          + '<span class="tec-name">'+t.Nombre+'</span>'
          + estadoBadge
          + '<span class="tec-rut">'+t.Rut+'</span>'
          + '<span class="tec-dias-activos">'+t.DiasActivos+' días activos</span>'
          + '<span class="tec-total">'+fmt1(t.Total)+' pts</span>'
          + '</summary>'
          + '<div class="tec-detail"><div class="day-grid">'+chips+'</div></div>'
          + '</details>';
      }).join('');

      groupsHtml += '<details class="supervisor" data-group-index="'+gi+'" open>'
        + '<summary><span class="sup-name">'+sup+'</span><span class="sup-meta">'+list.length+' técnicos</span><span class="sup-total">'+fmt1(supTotal)+' pts</span></summary>'
        + '<div class="tec-list">'+tecRows+'</div>'
        + '</details>';
    });
    document.getElementById('groups').innerHTML = groupsHtml;
    rebindFilter();
  }

  // ---- Sesion: un supervisor autenticado ve solo su propio equipo ----
  var searchInput = document.getElementById('searchInput');
  var searchCount = document.getElementById('searchCount');
  var loginScreen = document.getElementById('loginScreen');
  var mainScreen = document.getElementById('mainScreen');
  var rutInput = document.getElementById('rutInput');
  var loginBtn = document.getElementById('loginBtn');
  var loginError = document.getElementById('loginError');

  function applyView(sup){
    var list = bySup[sup] || [];
    document.getElementById('welcomeSub').textContent = 'Equipo de ' + sup;
    renderStats(list);
    renderGroups([sup]);
    searchInput.value = '';
    searchCount.textContent = '';
  }

  function doLogin(){
    var code = rutInput.value.replace(/[^0-9kK]/g, '').trim();
    var sup = SUPERVISOR_RUTS[code];
    if (!sup || !bySup[sup]) {
      loginError.textContent = 'RUT no reconocido. Verifica los últimos 6 dígitos.';
      return;
    }
    loginError.textContent = '';
    try { sessionStorage.setItem('portal_sup_session', code); } catch(e){}
    loginScreen.classList.add('hidden');
    mainScreen.classList.remove('hidden');
    applyView(sup);
  }

  loginBtn.addEventListener('click', doLogin);
  rutInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') doLogin(); });

  document.getElementById('logoutBtn').addEventListener('click', function(){
    try { sessionStorage.removeItem('portal_sup_session'); } catch(e){}
    mainScreen.classList.add('hidden');
    loginScreen.classList.remove('hidden');
    rutInput.value = '';
    loginError.textContent = '';
    rutInput.focus();
  });

  // Retomar sesion si ya habia una en esta pestaña
  try {
    var savedCode = sessionStorage.getItem('portal_sup_session');
    if (savedCode && SUPERVISOR_RUTS[savedCode]) {
      loginScreen.classList.add('hidden');
      mainScreen.classList.remove('hidden');
      applyView(SUPERVISOR_RUTS[savedCode]);
    }
  } catch(e){}

  function rebindFilter(){
    var allSupDetails = Array.prototype.slice.call(document.querySelectorAll('details.supervisor'));
    var allTecDetails = Array.prototype.slice.call(document.querySelectorAll('details.tecnico'));

    function doFilter(){
      var q = searchInput.value.trim().toLowerCase();
      var visibleCount = 0;
      if (!q) {
        allTecDetails.forEach(function(d){ d.classList.remove('hidden'); d.open = false; });
        allSupDetails.forEach(function(d){ d.classList.remove('hidden'); d.open = true; });
        searchCount.textContent = '';
        return;
      }
      allSupDetails.forEach(function(sup){
        var tecs = Array.prototype.slice.call(sup.querySelectorAll('details.tecnico'));
        var anyMatch = false;
        tecs.forEach(function(t){
          var match = t.getAttribute('data-nombre').indexOf(q) !== -1;
          t.classList.toggle('hidden', !match);
          t.open = match;
          if (match) { anyMatch = true; visibleCount++; }
        });
        sup.classList.toggle('hidden', !anyMatch);
        sup.open = anyMatch;
      });
      searchCount.textContent = visibleCount + ' técnico(s) encontrado(s)';
    }
    searchInput.oninput = doFilter;
  }

  var btn = document.getElementById('themeToggle');
  var root = document.documentElement;
  try {
    var saved = localStorage.getItem('produccion-tecnico-theme');
    if (saved) root.setAttribute('data-theme', saved);
  } catch(e){}
  btn.addEventListener('click', function(){
    var cur = root.getAttribute('data-theme');
    var next = cur === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('produccion-tecnico-theme', next); } catch(e){}
  });
})();
</script>
